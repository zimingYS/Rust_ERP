version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Shanghai"
    open-pull-requests-limit: 5
    # 把 minor / patch 合并成一个 PR，避免每个依赖一条噪声 PR；
    # major 升级仍单独开 PR，便于逐个评估兼容性。
    groups:
      cargo-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    labels:
      - "dependencies"
      - "backend"

  - package-ecosystem: "npm"
    directory: "/erp-frontend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Shanghai"
    open-pull-requests-limit: 5
    groups:
      npm-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    labels:
      - "dependencies"
      - "frontend"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
      timezone: "Asia/Shanghai"
    groups:
      actions-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    labels:
      - "dependencies"
      - "ci"

  # 容器基础镜像：后端 Dockerfile、前端 Dockerfile 与 nginx.conf 中的版本
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "monthly"
      timezone: "Asia/Shanghai"
    labels:
      - "dependencies"
      - "docker"

  - package-ecosystem: "docker"
    directory: "/erp-frontend"
    schedule:
      interval: "monthly"
      timezone: "Asia/Shanghai"
    labels:
      - "dependencies"
      - "docker"
