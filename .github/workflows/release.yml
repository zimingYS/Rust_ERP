name: Release Assets

# 发布 Release（而非打 tag）时触发：维护者在网页端 Publish release 之后，
# 本工作流构建产物并自动附加到该 Release。
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "要附加构建产物的标签，例如 v1.0.0"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    name: build-release-assets
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      # 与 CI 固定同一版本，保证发布产物可复现
      - name: Install Rust 1.98.0 (pinned)
        run: |
          rustup toolchain install 1.98.0 --profile minimal --no-self-update
          rustup default 1.98.0
          rustc --version

      - uses: Swatinem/rust-cache@v2

      - name: Build backend (release)
        run: cargo build --release -p erp-backend

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: erp-frontend/package-lock.json

      - name: Build frontend
        working-directory: erp-frontend
        run: npm ci && npm run build

      - name: Package artifacts
        run: |
          mkdir -p artifacts
          tar -czf "artifacts/erp-backend-linux-x86_64-${RELEASE_TAG}.tar.gz" -C target/release erp-backend
          tar -czf "artifacts/erp-frontend-dist-${RELEASE_TAG}.tar.gz" -C erp-frontend/dist .
          cp .env.example artifacts/env.example
          cd artifacts
          sha256sum erp-* env.example > SHA256SUMS.txt

      - name: Attach assets to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: artifacts/*
          fail_on_unmatched_files: true
