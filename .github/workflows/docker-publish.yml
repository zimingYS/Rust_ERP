name: Docker Publish

# 打 tag 即构建并推送 GHCR 镜像；Release 产物由 release.yml 负责，两者不重叠。
# 自动部署 job 默认关闭：只有仓库变量 DEPLOY_ENABLED=true 且配置了 SSH secrets 才会执行。
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "镜像版本标签，例如 v1.0.0"
        required: true
        type: string

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    name: build-${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: erp-backend
            dockerfile: Dockerfile
          - name: erp-frontend
            dockerfile: erp-frontend/Dockerfile
    steps:
      - uses: actions/checkout@v4

      # GHCR 镜像路径必须全小写，GitHub 登录名可能含大写字母
      - name: Resolve owner and version
        id: input
        run: |
          echo "owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
          echo "version=${{ inputs.version || github.ref_name }}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ steps.input.outputs.owner }}/rust_erp/${{ matrix.name }}
          tags: |
            type=raw,value=${{ steps.input.outputs.version }}
            type=raw,value=latest
          labels: |
            org.opencontainers.source=https://github.com/${{ github.repository }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

      - name: Summary
        run: |
          echo "## 镜像已推送" >> "$GITHUB_STEP_SUMMARY"
          echo '${{ steps.meta.outputs.tags }}' | tr ' ' '\n' | sed 's/^/- /' >> "$GITHUB_STEP_SUMMARY"

  deploy-ssh:
    name: deploy-ssh (opt-in)
    if: ${{ vars.DEPLOY_ENABLED == 'true' }}
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Resolve version
        id: v
        run: echo "version=${{ inputs.version || github.ref_name }}" >> "$GITHUB_OUTPUT"

      # 需要在仓库 Secrets 中配置 DEPLOY_HOST / DEPLOY_USER / DEPLOY_SSH_KEY /
      # DEPLOY_PATH / DEPLOY_PORT，详见 docs/RELEASING.md §4
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          script: |
            cd "${{ secrets.DEPLOY_PATH }}"
            export ERP_VERSION="${{ steps.v.outputs.version }}"
            export GHCR_OWNER="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
            docker compose pull
            docker compose up -d --no-build --remove-orphans
            docker image prune -f
