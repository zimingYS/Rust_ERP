name: "✨ 功能建议"
description: "提出新功能或改进建议（不含缺陷报告）"
title: "[Feature] "
labels: ["enhancement", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        请先用一句话说清**要解决什么问题**，再描述方案。
        注意本项目采用「可分享、禁止商业使用」的许可，提交建议即表示理解这一约束。

  - type: textarea
    id: problem
    attributes:
      label: 背景与痛点
      description: 现在的使用场景是什么？遇到什么限制？
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 期望方案
      description: 你希望系统如何表现？涉及哪些接口 / 页面？
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
    validations:
      required: false

  - type: dropdown
    id: module
    attributes:
      label: 影响模块
      options:
        - 认证 / 权限
        - 客户 / 供应商
        - 物品 / 库存
        - 采购 / 销售订单
        - 财务 / 报表
        - 工作流 / 通知
        - 仪表盘 / 导入
        - 前端界面
        - 工程化 / 文档
        - 跨模块 / 不确定
    validations:
      required: true

  - type: checkboxes
    id: contribution
    attributes:
      label: 参与意愿
      options:
        - label: 我愿意提交实现该功能的 Pull Request
          required: false
        - label: 我可以协助测试与验收
          required: false
