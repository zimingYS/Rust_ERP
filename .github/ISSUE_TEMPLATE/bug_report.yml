name: "🐛 缺陷报告"
description: "报告可以复现的功能异常"
title: "[Bug] "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        提交前请先搜索已有 Issue。
        **请勿粘贴任何真实口令、令牌或含个人信息的日志**，日志请先脱敏。

  - type: textarea
    id: summary
    attributes:
      label: 问题概述
      description: 一句话说明发生了什么
      placeholder: "在库存预警页面点击「确认」后接口返回 500"
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤
      placeholder: |
        1. 启动后端 …
        2. 打开页面 …
        3. 点击 …
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 期望行为
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: 实际行为 / 报错信息
      description: 请粘贴脱敏后的错误信息或截图
      render: shell
    validations:
      required: true

  - type: dropdown
    id: module
    attributes:
      label: 影响模块
      options:
        - 认证 / 权限
        - 客户 / 供应商
        - 物品 / 库存
        - 采购 / 销售订单
        - 财务 / 报表
        - 工作流 / 通知
        - 仪表盘 / 导入
        - 前端界面
        - 构建 / 部署
        - 其他 / 不确定
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: 运行环境
      placeholder: "Windows 11 / Rust 1.85 / Node 22 / PostgreSQL 16 / Chrome 130"
    validations:
      required: true

  - type: checkboxes
    id: confirm
    attributes:
      label: 确认
      options:
        - label: 我已确认提交内容不含任何密钥、口令或个人信息
          required: true
        - label: 我已搜索过现有 Issue，未发现重复
          required: true
