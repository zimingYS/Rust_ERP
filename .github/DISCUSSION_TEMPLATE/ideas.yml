title: "[想法] "
labels: []
body:
  - type: markdown
    attributes:
      value: |
        欢迎提出新功能、架构改进或工程化建议。发起前请先搜索已有 Discussion 与 Issue。
        本项目采用 **PolyForm Noncommercial 1.0.0**（可分享、禁止商业使用），请确认你的建议与许可约束不冲突。
  - type: textarea
    id: problem
    attributes:
      label: 想解决什么问题
      description: 描述现状与痛点，而不是直接给方案
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 大致思路
      description: 涉及哪些模块 / 接口 / 表？有没有参考实现？
    validations:
      required: true
  - type: dropdown
    id: scope
    attributes:
      label: 影响范围
      options:
        - 后端 / API
        - 前端 / 交互
        - 数据库 / 数据模型
        - 部署 / CI / 工程化
        - 文档 / 社区
        - 跨模块 / 不确定
    validations:
      required: true
  - type: checkboxes
    id: contribution
    attributes:
      label: 参与意愿
      options:
        - label: 我愿意提交实现该想法的 PR
          required: false
        - label: 我可以协助测试或写文档
          required: false
